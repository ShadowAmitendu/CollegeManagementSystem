<aside class="sticky top-0 flex h-dvh flex-col gap-6 px-4 py-5" aria-label="Primary navigation">
  <a routerLink="/dashboard" class="flex items-center gap-3 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#faf9f5]">
    <span class="grid size-9 place-items-center rounded-lg bg-[#cc785c] text-lg leading-none text-white">*</span>
    <span class="text-sm font-medium text-[#141413]">College Management</span>
  </a>

  <nav class="space-y-1">
    @for (item of visibleNavItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-[#efe9de] text-[#141413]"
        [routerLinkActiveOptions]="{ exact: false }"
        class="block rounded-lg px-3 py-2 text-sm font-medium text-[#6c6a64] transition hover:bg-[#f5f0e8] hover:text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#faf9f5]"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="mt-auto border-t border-[#e6dfd8] pt-4">
    @if (auth.user(); as user) {

      <div class="space-y-1">
        <a routerLink="/settings/profile" class="block rounded-lg px-3 py-2 text-sm font-medium text-[#6c6a64] hover:bg-[#f5f0e8] hover:text-[#141413]">Profile</a>
        <a routerLink="/settings" class="block rounded-lg px-3 py-2 text-sm font-medium text-[#6c6a64] hover:bg-[#f5f0e8] hover:text-[#141413]">Settings</a>
        <button
          type="button"
          class="w-full text-left rounded-lg px-3 py-2 text-sm font-medium text-[#cc785c] hover:bg-[#fdfbfa]"
          (click)="signOut()"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</aside>
