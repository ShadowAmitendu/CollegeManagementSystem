<aside class="sticky top-0 flex h-dvh flex-col gap-6 px-4 py-5" aria-label="Primary navigation">
  <a routerLink="/dashboard" class="flex items-center gap-3 rounded-xl px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-zinc-950">
    <span class="grid size-9 place-items-center rounded-xl bg-zinc-950 text-sm font-semibold text-white">CMS</span>
    <span class="text-sm font-semibold text-zinc-950">College Management</span>
  </a>

  <nav class="space-y-1">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-zinc-100 text-zinc-950"
        class="block rounded-xl px-3 py-2 text-sm font-medium text-zinc-600 transition hover:bg-zinc-50 hover:text-zinc-950 focus:outline-none focus:ring-2 focus:ring-zinc-950"
      >
        {{ item.label }}
      </a>
    }
  </nav>
</aside>
