<form class="rounded-xl bg-[#efe9de] p-5" [formGroup]="form" (ngSubmit)="submitForm()">
  <div class="grid gap-4 md:grid-cols-2">
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Admission number</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="admissionNumber" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Email</span>
      <input type="email" class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="email" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">First name</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="firstName" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Last name</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="lastName" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Phone</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="phone" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Program</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="program" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Department ID</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="departmentId" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Department name</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="departmentName" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Section</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="section" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Advisor</span>
      <input class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="advisorName" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Semester</span>
      <input type="number" class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="semester" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Enrollment year</span>
      <input type="number" class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="enrollmentYear" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">CGPA</span>
      <input type="number" step="0.1" class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="cgpa" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Attendance %</span>
      <input type="number" class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="attendancePercentage" />
    </label>
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#141413]">Status</span>
      <select class="min-h-10 w-full rounded-lg border border-[#e6dfd8] bg-white px-3 text-sm capitalize outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" formControlName="status">
        @for (status of statuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>
  </div>

  <div class="mt-6 flex flex-wrap justify-end gap-3">
    <button type="button" class="min-h-10 rounded-lg border border-[#e6dfd8] bg-[#faf9f5] px-5 text-sm font-medium text-[#141413] hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]" (click)="cancel.emit()">
      Cancel
    </button>
    <button type="submit" class="min-h-10 rounded-lg bg-[#cc785c] px-5 text-sm font-medium text-white hover:bg-[#a9583e] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#efe9de]">
      {{ mode() === 'create' ? 'Create student' : 'Save changes' }}
    </button>
  </div>
</form>
