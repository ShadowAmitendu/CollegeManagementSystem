<section class="rounded-xl bg-[#181715] p-6 text-[#faf9f5]" aria-label="Student profile summary">
  <div class="grid gap-5 md:grid-cols-[auto_1fr_auto] md:items-center">
    <div class="grid size-16 place-items-center rounded-xl bg-[#cc785c] font-serif text-2xl text-white">
      {{ initials() }}
    </div>
    <div>
      <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#a09d96]">{{ student().admissionNumber }}</p>
      <h1 class="mt-2 font-serif text-4xl font-normal leading-tight">{{ fullName() }}</h1>
      <p class="mt-2 text-sm text-[#d8d2ca]">{{ student().program }} · {{ student().departmentName }}</p>
    </div>
    <button
      type="button"
      class="inline-flex min-h-10 items-center justify-center rounded-lg bg-[#cc785c] px-5 text-sm font-medium text-white hover:bg-[#a9583e] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#181715]"
      (click)="editStudent.emit(student().$id)"
    >
      Edit profile
    </button>
  </div>
</section>
