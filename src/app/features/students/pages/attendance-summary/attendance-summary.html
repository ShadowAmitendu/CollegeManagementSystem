<div class="space-y-6">
  <div class="flex items-end justify-between">
    <div>
      <h1 class="font-serif text-3xl font-normal text-[#141413]">Attendance Sessions</h1>
    </div>
    <div class="flex gap-3">
      <a
        routerLink="/attendance/mark"
        class="rounded-lg border border-[#e6dfd8] bg-white px-4 py-2 text-sm font-medium text-[#141413] hover:bg-[#faf9f5] inline-flex items-center"
      >
        Mark Attendance
      </a>
    </div>
  </div>

  <!-- Search & Filter Section (Dark Box) -->
  <div class="rounded-xl bg-[#23221c] p-4 grid grid-cols-12 gap-4 items-end text-white">
    <!-- Search Input -->
    <div class="col-span-4 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]"
        >Search subject</label
      >
      <div class="relative">
        <input
          type="text"
          placeholder="Subject or faculty..."
          class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white placeholder-[#8e8b82] focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
        />
      </div>
    </div>

    <!-- Date Filter -->
    <div class="col-span-3 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Date</label>
      <input
        type="date"
        class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
      />
    </div>

    <!-- Status Dropdown -->
    <div class="col-span-3 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Status</label>
      <select
        class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
      >
        <option>All Statuses</option>
        <option>Draft</option>
        <option>Published</option>
        <option>Locked</option>
        <option>Cancelled</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-xl border border-[#e6dfd8]">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-[#e6dfd8] bg-[#faf9f5] text-left text-sm">
        <thead class="bg-[#efe9de] text-xs uppercase tracking-[0.14em] text-[#6c6a64]">
          <tr>
            <th class="px-4 py-3 font-medium" scope="col">Date & Time</th>
            <th class="px-4 py-3 font-medium" scope="col">Subject</th>
            <th class="px-4 py-3 font-medium" scope="col">Faculty</th>
            <th class="px-4 py-3 font-medium" scope="col">Status</th>
            <th class="px-4 py-3 font-medium" scope="col">Summary</th>
            <th class="px-4 py-3 font-medium" scope="col">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#e6dfd8]">
          @for (item of data(); track item.id) {
            <tr class="align-top">
              <td class="px-4 py-4">
                <p class="font-medium text-[#141413]">{{ item.date }}</p>
                <p class="text-xs text-[#6c6a64]">{{ item.time }}</p>
              </td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.subject }}</td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.faculty }}</td>
              <td class="px-4 py-4">
                <span
                  class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                  [class.bg-yellow-100]="item.status === 'Draft'"
                  [class.text-yellow-800]="item.status === 'Draft'"
                  [class.bg-green-100]="item.status === 'Published'"
                  [class.text-green-800]="item.status === 'Published'"
                  [class.bg-zinc-100]="item.status === 'Locked'"
                  [class.text-zinc-800]="item.status === 'Locked'"
                >
                  {{ item.status }}
                </span>
              </td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.summary }}</td>
              <td class="px-4 py-4">
                <button class="text-[#cc785c] hover:underline font-medium text-sm">View</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="px-4 py-10 text-center text-[#6c6a64]" colspan="6">No sessions found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
