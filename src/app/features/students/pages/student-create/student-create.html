<section class="space-y-8" aria-labelledby="student-create-title">
  <header class="border-b border-[#e6dfd8] pb-8">
    <a routerLink="/students" class="text-sm font-medium text-[#6c6a64] hover:text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c]">Back to students</a>
    <p class="mt-5 text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">Students</p>
    <h1 id="student-create-title" class="mt-3 font-serif text-5xl font-normal leading-[1.05] text-[#141413]">Create Student</h1>
    <p class="mt-4 max-w-2xl text-base leading-7 text-[#3d3d3a]">Add a development student record that flows through the directory and profile screens.</p>
  </header>

  <app-student-form mode="create" (save)="saveStudent($event)" (cancel)="cancel()" />
</section>
