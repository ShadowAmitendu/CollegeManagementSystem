<div class="space-y-6">

  <div class="flex items-end justify-between">
    <div>
      <h1 class="font-serif text-3xl font-normal text-[#141413]">Alumni</h1>
    </div>
    <div class="flex gap-3">
      <button class="rounded-lg border border-[#e6dfd8] bg-white px-4 py-2 text-sm font-medium text-[#141413] hover:bg-[#faf9f5]">Export CSV</button>
    </div>
  </div>

  <!-- Search & Filter Section (Dark Box) -->
  <div class="rounded-xl bg-[#23221c] p-4 grid grid-cols-12 gap-4 items-end text-white">
    <!-- Search Input -->
    <div class="col-span-6 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Search alumni</label>
      <div class="relative">
        <input
          type="text"
          placeholder="Name, ID..."
          class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white placeholder-[#8e8b82] focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
        />
      </div>
    </div>

    <!-- Department Dropdown -->
    <div class="col-span-3 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Department</label>
      <select
        class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
      >
        <option>All Departments</option>
        <option>Computer Science</option>
        <option>Mechanical</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-xl border border-[#e6dfd8]">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-[#e6dfd8] bg-[#faf9f5] text-left text-sm">
        <thead class="bg-[#efe9de] text-xs uppercase tracking-[0.14em] text-[#6c6a64]">
          <tr>
            <th class="px-4 py-3 font-medium" scope="col">Name</th>
            <th class="px-4 py-3 font-medium" scope="col">ID</th>
            <th class="px-4 py-3 font-medium" scope="col">Program</th>
            <th class="px-4 py-3 font-medium" scope="col">Graduation Year</th>
            <th class="px-4 py-3 font-medium" scope="col">CGPA</th>
            <th class="px-4 py-3 font-medium" scope="col">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#e6dfd8]">
          @for (item of data(); track item.id) {
            <tr class="align-top">
              <td class="px-4 py-4">
                <p class="font-medium text-[#141413]">{{ item.name }}</p>
              </td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.id }}</td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.program }}</td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.graduationyear }}</td>
              <td class="px-4 py-4 text-[#3d3d3a]">{{ item.cgpa }}</td>
              <td class="px-4 py-4">
                <button class="text-[#cc785c] hover:underline font-medium text-sm">View</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="px-4 py-10 text-center text-[#6c6a64]" colspan="6">No records found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="border-t border-[#e6dfd8] bg-[#faf9f5] p-4 flex items-center justify-between text-sm text-[#6c6a64]">
      <span>Showing 1 to 10 of 42 results</span>
      <div class="flex gap-2">
        <button class="rounded border border-[#e6dfd8] bg-white px-3 py-1 hover:bg-[#efe9de]">Previous</button>
        <button class="rounded border border-[#e6dfd8] bg-white px-3 py-1 hover:bg-[#efe9de]">Next</button>
      </div>
    </div>
  </div>
</div>
