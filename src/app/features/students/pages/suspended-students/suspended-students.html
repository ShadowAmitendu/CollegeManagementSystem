<div class="space-y-6">
  <div class="flex items-end justify-between">
    <div>

      <h1 class="font-serif text-3xl font-normal text-[#141413]">Suspended Students</h1>
    </div>
    <div class="flex gap-3">
      <button
        class="rounded-lg border border-[#e6dfd8] bg-white px-4 py-2 text-sm font-medium text-[#141413] hover:bg-[#faf9f5]"
      >
        Export CSV
      </button>
    </div>
  </div>

  <div class="rounded-2xl border border-[#e6dfd8] bg-white shadow-sm overflow-hidden">
    <div class="border-b border-[#e6dfd8] bg-[#faf9f5] p-4 flex gap-4">
      <input
        type="text"
        placeholder="Search..."
        class="w-64 rounded-lg border border-[#e6dfd8] bg-white px-3 py-2 text-sm text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c]"
      />
      <select
        class="rounded-lg border border-[#e6dfd8] bg-white px-3 py-2 text-sm text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c]"
      >
        <option>All Departments</option>
        <option>Computer Science</option>
        <option>Mechanical</option>
      </select>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-[#141413]">
        <thead class="bg-[#faf9f5] font-medium text-[#6c6a64]">
          <tr>
            <th class="px-6 py-4">Name</th>
            <th class="px-6 py-4">ID</th>
            <th class="px-6 py-4">Program</th>
            <th class="px-6 py-4">Department</th>
            <th class="px-6 py-4">Email</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#e6dfd8]">
          @for (item of data(); track item.$id) {
            <tr class="hover:bg-[#faf9f5] transition-colors">
              <td class="px-6 py-4 font-medium">{{ item.firstName }} {{ item.lastName }}</td>
              <td class="px-6 py-4 text-[#6c6a64]">{{ item.$id }}</td>
              <td class="px-6 py-4 text-[#6c6a64]">{{ item.program }}</td>
              <td class="px-6 py-4 text-[#6c6a64]">{{ item.departmentName }}</td>
              <td class="px-6 py-4 text-[#6c6a64]">{{ item.email }}</td>
              <td class="px-6 py-4 text-right">
                <button class="text-[#cc785c] hover:underline font-medium text-sm">View</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="100%" class="px-6 py-12 text-center text-[#6c6a64]">
                No records found.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div
      class="border-t border-[#e6dfd8] bg-[#faf9f5] p-4 flex items-center justify-between text-sm text-[#6c6a64]"
    >
      <span>Showing 1 to 10 of 42 results</span>
      <div class="flex gap-2">
        <button class="rounded border border-[#e6dfd8] bg-white px-3 py-1 hover:bg-[#efe9de]">
          Previous
        </button>
        <button class="rounded border border-[#e6dfd8] bg-white px-3 py-1 hover:bg-[#efe9de]">
          Next
        </button>
      </div>
    </div>
  </div>
</div>
