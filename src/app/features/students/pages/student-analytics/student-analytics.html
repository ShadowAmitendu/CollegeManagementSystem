<div class="space-y-6">
  <div class="mb-6 flex items-end justify-between">
    <div>

      <h1 class="font-serif text-3xl font-normal text-[#141413]">Student Analytics</h1>
    </div>
    <div class="flex gap-3">
      <button
        class="rounded-lg border border-[#e6dfd8] bg-white px-4 py-2 text-sm font-medium text-[#141413] hover:bg-[#faf9f5]"
        (click)="exportData()"
      >
        Save as PDF
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    @for (metric of metrics(); track metric.label) {
      <div class="rounded-xl bg-[#efe9de] p-4 flex flex-col justify-between h-28">
        <div>
          <p class="text-[10px] font-medium tracking-wider uppercase text-[#6c6a64]">{{ metric.label }}</p>
          <p class="text-3xl font-normal text-[#141413] mt-1">{{ metric.value }}</p>
        </div>
        <p
          class="text-xs font-medium"
          [class.text-emerald-600]="metric.positive"
          [class.text-red-600]="!metric.positive"
        >
          {{ metric.trend }}
        </p>
      </div>
    }
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div
      class="lg:col-span-2 rounded-2xl border border-[#e6dfd8] bg-white p-6 shadow-sm min-h-[400px] flex flex-col items-center justify-center text-[#6c6a64]"
    >
      <!-- Chart Placeholder -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="mb-4 text-[#cc785c]"
      >
        <path d="M3 3v18h18" />
        <path d="m19 9-5 5-4-4-3 3" />
      </svg>
      <p class="font-medium">Enrollment Trends Chart</p>
      <p class="text-sm mt-1 text-center max-w-xs">
        Waiting for ng-apexcharts integration to render historical data.
      </p>
    </div>
    <div
      class="rounded-2xl border border-[#e6dfd8] bg-white p-6 shadow-sm min-h-[400px] flex flex-col items-center justify-center text-[#6c6a64]"
    >
      <!-- Chart Placeholder -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="mb-4 text-[#cc785c]"
      >
        <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
        <path d="M22 12A10 10 0 0 0 12 2v10z" />
      </svg>
      <p class="font-medium">Demographics</p>
      <p class="text-sm mt-1 text-center">Department distribution.</p>
    </div>
  </div>
</div>
