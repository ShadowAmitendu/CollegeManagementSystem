<section class="space-y-8" aria-labelledby="student-list-title">
  <div class="mb-6 flex items-end justify-between">
    <div>

      <h1 class="font-serif text-3xl font-normal text-[#141413]">Directory</h1>
    </div>
    @if (canCreateStudent()) {
      <div class="flex gap-3">
        <a routerLink="/students/create" class="rounded-lg bg-[#cc785c] px-4 py-2 text-sm font-medium text-white hover:bg-[#a9583e]">Add New</a>
        <a routerLink="/students/import" class="rounded-lg border border-[#e6dfd8] bg-[#faf9f5] px-4 py-2 text-sm font-medium text-[#141413] hover:bg-[#f5f0e8]">Upload CSV</a>
      </div>
    }
  </div>

  <div class="grid gap-4 md:grid-cols-5">
    @for (stat of students.stats(); track stat.label) {
      <article class="rounded-xl bg-[#efe9de] p-5">
        <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">{{ stat.label }}</p>
        <p class="mt-3 font-serif text-3xl font-normal text-[#141413]">{{ stat.value }}</p>
      </article>
    }
  </div>

  <section class="rounded-xl bg-[#181715] p-5 text-[#faf9f5]" aria-label="Student filters">
    <div class="grid gap-4 md:grid-cols-[1fr_14rem_12rem]">
      <label class="block space-y-2">
        <span class="text-sm font-medium">Search students</span>
        <input type="search" class="min-h-10 w-full rounded-lg border border-[#252320] bg-[#1f1e1b] px-3 text-sm outline-none placeholder:text-[#a09d96] focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" placeholder="Name, admission, advisor" [value]="students.search()" (input)="onSearch($event)" />
      </label>
      <label class="block space-y-2">
        <span class="text-sm font-medium">Department</span>
        <select class="min-h-10 w-full rounded-lg border border-[#252320] bg-[#1f1e1b] px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" [value]="students.selectedDepartment()" (change)="onDepartmentChange($event)">
          <option value="all">All departments</option>
          @for (department of students.departments(); track department) {
            <option [value]="department">{{ department }}</option>
          }
        </select>
      </label>
      <label class="block space-y-2">
        <span class="text-sm font-medium">Status</span>
        <select class="min-h-10 w-full rounded-lg border border-[#252320] bg-[#1f1e1b] px-3 text-sm outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20" [value]="students.selectedStatus()" (change)="onStatusChange($event)">
          <option value="all">All status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="graduated">Graduated</option>
          <option value="suspended">Suspended</option>
        </select>
      </label>
    </div>
  </section>

  <app-student-table [students]="students.filteredRows()" (viewStudent)="openStudent($event)" (editStudent)="editStudent($event)" />
</section>
