<section class="space-y-6" aria-labelledby="student-list-title">
  <!-- Title & Action Buttons -->
  <div class="flex items-end justify-between">
    <div>
      <h1 class="font-serif text-3xl font-normal text-[#141413]">Directory</h1>
    </div>
    @if (canCreateStudent()) {
      <div class="flex gap-3">
        <a routerLink="/students/create" class="rounded-lg bg-[#cc785c] px-4 py-2 text-sm font-medium text-white hover:bg-[#b86146] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2">
          Add New
        </a>

      </div>
    }
  </div>

  <!-- Metric Cards -->
  <div class="grid grid-cols-5 gap-4">
    @for (stat of students.stats(); track stat.label) {
      <div class="rounded-xl bg-[#efe9de] p-4 flex flex-col justify-between h-24">
        <p class="text-[10px] font-medium tracking-wider uppercase text-[#6c6a64]">{{ stat.label }}</p>
        <p class="text-3xl font-normal text-[#141413]">{{ stat.value }}</p>
      </div>
    }
  </div>

  <!-- Search & Filter Section (Dark Box) -->
  <div class="rounded-xl bg-[#23221c] p-4 grid grid-cols-12 gap-4 items-end text-white">
    <!-- Search Input -->
    <div class="col-span-6 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Search students</label>
      <div class="relative">
        <input
          type="search"
          placeholder="Name, admission, advisor"
          class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg pl-3 pr-10 py-2 text-sm text-white placeholder-[#6c6a64] focus:outline-none focus:ring-1 focus:ring-[#cc785c] focus:border-transparent"
          [value]="students.search()"
          (input)="onSearch($event)"
        />
      </div>
    </div>

    <!-- Department Dropdown -->
    <div class="col-span-3 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Department</label>
      <select
        class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
        [value]="students.selectedDepartment()"
        (change)="onDepartmentChange($event)"
      >
        <option value="all">All departments</option>
        @for (department of students.departments(); track department) {
          <option [value]="department">{{ department }}</option>
        }
      </select>
    </div>

    <!-- Status Dropdown -->
    <div class="col-span-3 space-y-1">
      <label class="text-[10px] font-medium tracking-wider uppercase text-[#8e8b82]">Status</label>
      <select
        class="w-full bg-[#1c1a16] border border-[#2a2923] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-[#cc785c]"
        [value]="students.selectedStatus()"
        (change)="onStatusChange($event)"
      >
        <option value="all">All status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="graduated">Graduated</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <app-student-table [students]="students.filteredRows()" (viewStudent)="openStudent($event)" (editStudent)="editStudent($event)" />
</section>
