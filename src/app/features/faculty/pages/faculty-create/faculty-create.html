<section class="space-y-8" aria-labelledby="faculty-create-title">
  <header class="border-b border-[#e6dfd8] pb-8">
    <a routerLink="/faculty" class="text-sm font-medium text-[#6c6a64] hover:text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c]">Back to faculty</a>
    <p class="mt-5 text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">Faculty</p>
    <h1 id="faculty-create-title" class="mt-3 font-serif text-5xl font-normal leading-[1.05] text-[#141413]">Create Faculty</h1>
    <p class="mt-4 max-w-2xl text-base leading-7 text-[#3d3d3a]">Add a development faculty record with department, specialization, and advisory load.</p>
  </header>

  <app-faculty-form mode="create" (save)="saveFaculty($event)" (cancel)="cancel()" />
</section>
