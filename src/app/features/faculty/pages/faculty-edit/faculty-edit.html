@if (member(); as memberValue) {
  <section class="space-y-8" aria-labelledby="faculty-edit-title">
    <header class="border-b border-[#e6dfd8] pb-8">
      <a [routerLink]="['/faculty', memberValue.$id]" class="text-sm font-medium text-[#6c6a64] hover:text-[#141413] focus:outline-none focus:ring-2 focus:ring-[#cc785c]">Back to profile</a>
      <p class="mt-5 text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">{{ memberValue.employeeNumber }}</p>
      <h1 id="faculty-edit-title" class="mt-3 font-serif text-5xl font-normal leading-[1.05] text-[#141413]">Edit Faculty</h1>
      <p class="mt-4 max-w-2xl text-base leading-7 text-[#3d3d3a]">Update the faculty record in the static development store.</p>
    </header>

    <app-faculty-form mode="edit" [faculty]="memberValue" (save)="saveFaculty($event)" (cancel)="cancel()" />
  </section>
} @else {
  <section class="rounded-xl bg-[#efe9de] p-8 text-[#3d3d3a]">
    <h1 class="font-serif text-3xl font-normal text-[#141413]">Faculty member not found</h1>
    <a routerLink="/faculty" class="mt-5 inline-flex min-h-10 items-center rounded-lg bg-[#cc785c] px-5 text-sm font-medium text-white">Back to faculty</a>
  </section>
}
