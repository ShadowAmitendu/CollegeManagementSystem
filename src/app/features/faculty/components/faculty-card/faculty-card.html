<article class="flex h-full flex-col rounded-xl bg-[#efe9de] p-5 text-[#141413]">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">{{ faculty().employeeNumber }}</p>
      <h2 class="mt-3 font-serif text-2xl font-normal leading-tight">{{ fullName() }}</h2>
      <p class="mt-2 text-sm text-[#6c6a64]">{{ faculty().designation }} · {{ faculty().departmentName }}</p>
    </div>
    <span class="shrink-0 rounded-full px-3 py-1 text-xs font-medium capitalize" [class]="statusClass()">
      {{ faculty().status }}
    </span>
  </div>

  <p class="mt-4 line-clamp-2 text-sm leading-6 text-[#3d3d3a]">{{ faculty().specialization }}</p>

  <dl class="mt-5 grid grid-cols-3 gap-3 text-sm">
    <div>
      <dt class="text-xs text-[#6c6a64]">Courses</dt>
      <dd class="mt-1 font-medium">{{ faculty().coursesAssigned }}</dd>
    </div>
    <div>
      <dt class="text-xs text-[#6c6a64]">Advisees</dt>
      <dd class="mt-1 font-medium">{{ faculty().adviseeCount }}</dd>
    </div>
    <div>
      <dt class="text-xs text-[#6c6a64]">Office</dt>
      <dd class="mt-1 font-medium">{{ faculty().office }}</dd>
    </div>
  </dl>

  <div class="mt-6 grid grid-cols-2 gap-2">
    <button type="button" class="min-h-10 rounded-lg border border-[#e6dfd8] bg-[#faf9f5] px-3 text-sm font-medium text-[#141413] transition hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]" (click)="viewFaculty.emit(faculty().$id)">
      Details
    </button>
    <button type="button" class="min-h-10 rounded-lg bg-[#cc785c] px-3 text-sm font-medium text-white transition hover:bg-[#a9583e] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#efe9de]" (click)="editFaculty.emit(faculty().$id)">
      Edit
    </button>
  </div>
</article>
