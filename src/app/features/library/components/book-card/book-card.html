<article class="flex h-full flex-col rounded-xl bg-[#efe9de] p-5 text-[#141413]">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">{{ book().category }}</p>
      <h2 class="mt-3 line-clamp-2 font-serif text-2xl font-normal leading-tight">{{ book().title }}</h2>
      <p class="mt-2 text-sm text-[#6c6a64]">{{ book().author }}</p>
    </div>
    <span class="shrink-0 rounded-full bg-[#faf9f5] px-3 py-1 text-xs font-medium text-[#141413]">
      {{ availability() }}
    </span>
  </div>

  <p class="mt-4 line-clamp-3 text-sm leading-6 text-[#3d3d3a]">{{ book().description }}</p>

  <dl class="mt-5 grid grid-cols-3 gap-3 text-sm">
    <div>
      <dt class="text-xs text-[#6c6a64]">Available</dt>
      <dd class="mt-1 font-medium">{{ book().availableCopies }}/{{ book().totalCopies }}</dd>
    </div>
    <div>
      <dt class="text-xs text-[#6c6a64]">Issues</dt>
      <dd class="mt-1 font-medium">{{ activeIssues() }}</dd>
    </div>
    <div>
      <dt class="text-xs text-[#6c6a64]">Shelf</dt>
      <dd class="mt-1 font-medium">{{ book().location }}</dd>
    </div>
  </dl>

  <div class="mt-6 grid grid-cols-2 gap-2">
    <button
      type="button"
      class="min-h-10 rounded-lg border border-[#e6dfd8] bg-[#faf9f5] px-3 text-sm font-medium text-[#141413] transition hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]"
      (click)="viewBook.emit(book().$id)"
    >
      Details
    </button>
    <button
      type="button"
      class="min-h-10 rounded-lg bg-[#cc785c] px-3 text-sm font-medium text-white transition hover:bg-[#a9583e] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#efe9de] disabled:cursor-not-allowed disabled:bg-[#e6dfd8] disabled:text-[#8e8b82]"
      [disabled]="book().availableCopies === 0"
      (click)="issueBook.emit(book().$id)"
    >
      Issue
    </button>
  </div>
</article>
