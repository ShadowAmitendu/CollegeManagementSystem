<div class="overflow-x-auto">
  <table class="min-w-full divide-y divide-[#e6dfd8] bg-[#faf9f5] text-left text-sm">
    <thead class="bg-[#efe9de] text-xs uppercase tracking-[0.14em] text-[#6c6a64]">
      <tr>
        <th class="px-4 py-3 font-medium" scope="col">Book</th>
        <th class="px-4 py-3 font-medium" scope="col">Category</th>
        <th class="px-4 py-3 font-medium" scope="col">Shelf</th>
        <th class="px-4 py-3 font-medium" scope="col">Copies</th>
        <th class="px-4 py-3 font-medium" scope="col">Actions</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-[#e6dfd8]">
      @for (book of books(); track book.$id) {
        <tr class="align-top">
          <td class="px-4 py-4">
            <p class="font-medium text-[#141413]">{{ book.title }}</p>
            <p class="mt-1 text-xs text-[#6c6a64]">{{ book.author }} · {{ book.isbn }}</p>
          </td>
          <td class="px-4 py-4 text-[#3d3d3a]">{{ book.category }}</td>
          <td class="px-4 py-4 font-mono text-xs text-[#3d3d3a]">{{ book.location }}</td>
          <td class="px-4 py-4 text-[#3d3d3a]">{{ book.availableCopies }}/{{ book.totalCopies }}</td>
          <td class="px-4 py-4">
            <div class="flex gap-2">
              <button
                type="button"
                class="rounded-lg border border-[#e6dfd8] px-3 py-2 text-xs font-medium text-[#141413] hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]"
                (click)="viewBook.emit(book.$id)"
              >
                Details
              </button>
              <button
                type="button"
                class="rounded-lg bg-[#181715] px-3 py-2 text-xs font-medium text-[#faf9f5] hover:bg-[#252320] focus:outline-none focus:ring-2 focus:ring-[#cc785c] disabled:cursor-not-allowed disabled:bg-[#e6dfd8] disabled:text-[#8e8b82]"
                [disabled]="book.availableCopies === 0"
                (click)="issueBook.emit(book.$id)"
              >
                Issue
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="px-4 py-10 text-center text-[#6c6a64]" colspan="5">No books match the current filters.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
