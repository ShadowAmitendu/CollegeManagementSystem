<section class="space-y-6" aria-labelledby="notification-list-title">
  <header class="grid gap-6 border-b border-[#e6dfd8] pb-6 lg:grid-cols-[1fr_auto]">
    <div class="space-y-3">
      <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">{{ eyebrow() }}</p>
      <h1 id="notification-list-title" class="font-serif text-4xl font-normal leading-tight text-[#141413]">{{ title() }}</h1>
      <p class="max-w-2xl text-sm leading-6 text-[#3d3d3a]">{{ description() }}</p>
    </div>
    <button
      type="button"
      class="inline-flex min-h-10 items-center justify-center self-start rounded-lg bg-[#cc785c] px-5 text-sm font-medium text-white transition hover:bg-[#a9583e] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#faf9f5]"
    >
      Configure
    </button>
  </header>

  <div class="grid gap-4 sm:grid-cols-3">
    @for (metric of metrics(); track metric.label) {
      <article class="rounded-xl bg-[#efe9de] p-5">
        <div class="flex items-center justify-between gap-4">
          <p class="text-sm font-medium text-[#6c6a64]">{{ metric.label }}</p>
          <span class="rounded-full bg-[#faf9f5] px-2.5 py-1 text-xs font-medium text-[#141413]">{{ metric.value }}</span>
        </div>
      </article>
    }
  </div>
</section>
