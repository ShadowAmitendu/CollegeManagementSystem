<article class="rounded-lg border border-[#e6dfd8] bg-[#faf9f5] p-3">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-medium text-[#141413]">{{ user().name }}</h3>
      <p class="mt-1 truncate text-xs text-[#6c6a64]">{{ user().email }}</p>
    </div>
    <span class="shrink-0 rounded-full bg-[#efe9de] px-2 py-1 text-xs font-medium text-[#141413]">
      {{ user().roles[0] }}
    </span>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-2">
    <button
      type="button"
      class="min-h-9 rounded-lg border border-[#e6dfd8] px-2 text-xs font-medium text-[#3d3d3a] transition hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]"
      (click)="fillUser.emit(user())"
    >
      Fill
    </button>
    <button
      type="button"
      class="min-h-9 rounded-lg bg-[#181715] px-2 text-xs font-medium text-[#faf9f5] transition hover:bg-[#252320] focus:outline-none focus:ring-2 focus:ring-[#cc785c] focus:ring-offset-2 focus:ring-offset-[#faf9f5]"
      (click)="selectUser.emit(user())"
    >
      Login
    </button>
  </div>
</article>
