<article class="rounded-xl border border-zinc-200 bg-white p-3 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="truncate text-sm font-semibold text-zinc-950">{{ user().name }}</h3>
      <p class="mt-1 truncate text-xs text-zinc-500">{{ user().email }}</p>
    </div>
    <span class="shrink-0 rounded-full bg-zinc-100 px-2 py-1 text-xs font-medium text-zinc-700">
      {{ user().roles[0] }}
    </span>
  </div>

  <div class="mt-3 grid grid-cols-2 gap-2">
    <button
      type="button"
      class="min-h-9 rounded-lg border border-zinc-300 px-2 text-xs font-medium text-zinc-700 transition hover:bg-zinc-50 focus:outline-none focus:ring-2 focus:ring-zinc-950"
      (click)="fillUser.emit(user())"
    >
      Fill
    </button>
    <button
      type="button"
      class="min-h-9 rounded-lg bg-zinc-950 px-2 text-xs font-medium text-white transition hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:ring-offset-2"
      (click)="selectUser.emit(user())"
    >
      Login
    </button>
  </div>
</article>
