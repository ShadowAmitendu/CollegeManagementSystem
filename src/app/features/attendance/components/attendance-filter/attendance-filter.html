<section class="rounded-xl bg-[#181715] p-5 text-[#faf9f5]" aria-label="Attendance filters">
  <div class="grid gap-4 md:grid-cols-[1fr_14rem]">
    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#faf9f5]">Search sessions</span>
      <input
        type="search"
        class="min-h-10 w-full rounded-lg border border-[#252320] bg-[#1f1e1b] px-3 text-sm text-[#faf9f5] outline-none placeholder:text-[#a09d96] focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20"
        placeholder="Course, faculty, room, date"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>

    <label class="block space-y-2">
      <span class="text-sm font-medium text-[#faf9f5]">Status</span>
      <select
        class="min-h-10 w-full rounded-lg border border-[#252320] bg-[#1f1e1b] px-3 text-sm text-[#faf9f5] outline-none focus:border-[#cc785c] focus:ring-4 focus:ring-[#cc785c]/20"
        [value]="selectedStatus()"
        (change)="onStatusChange($event)"
      >
        <option value="all">All sessions</option>
        <option value="draft">Draft</option>
        <option value="submitted">Submitted</option>
        <option value="locked">Locked</option>
      </select>
    </label>
  </div>
</section>
