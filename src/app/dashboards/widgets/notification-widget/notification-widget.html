<article class="h-full rounded-xl bg-[#efe9de] p-5 text-[#141413]">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-medium uppercase tracking-[0.14em] text-[#6c6a64]">Notifications</p>
      <h2 class="mt-3 font-serif text-3xl font-normal">{{ notifications.stats()[1].value }}</h2>
      <p class="mt-1 text-sm text-[#6c6a64]">published</p>
    </div>
    <a routerLink="/notifications" class="rounded-lg bg-[#faf9f5] px-3 py-2 text-sm font-medium hover:bg-[#f5f0e8] focus:outline-none focus:ring-2 focus:ring-[#cc785c]">Open</a>
  </div>
  <div class="mt-5 grid grid-cols-2 gap-3 text-sm">
    <div><p class="text-[#6c6a64]">Drafts</p><p class="mt-1 font-medium">{{ notifications.stats()[2].value }}</p></div>
    <div><p class="text-[#6c6a64]">Reads</p><p class="mt-1 font-medium">{{ notifications.stats()[4].value }}</p></div>
  </div>
</article>
