<section class="space-y-6" aria-labelledby="dashboard-title">
  <header class="border-b border-zinc-200 pb-5">
    <p class="text-xs font-medium uppercase tracking-wide text-zinc-500">Dashboard</p>
    <h1 id="dashboard-title" class="mt-2 text-2xl font-semibold tracking-normal text-zinc-950">College Operations</h1>
    <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-600">
      Widget-ready dashboard boilerplate for role-specific analytics, Appwrite realtime updates, and permission-driven workflows.
    </p>
  </header>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
    @for (widget of widgets(); track widget.title) {
      <article class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm">
        <p class="text-sm font-medium text-zinc-600">{{ widget.title }}</p>
        <p class="mt-3 text-2xl font-semibold text-zinc-950">{{ widget.value }}</p>
        <p class="mt-2 text-sm leading-6 text-zinc-600">{{ widget.description }}</p>
      </article>
    }
  </div>
</section>
